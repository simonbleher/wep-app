name: Windows Release

# Baut den signierten Installer des Windows-Programms (Tauri, NSIS, ohne Admin-Rechte) und
# veröffentlicht ihn als GitHub Release und auf dem Cloudflare-Projekt wep-pankow-apk unter /windows/
# (feste Adresse wep-setup.exe + latest.json für den Tauri-Updater).
# Läuft NUR, wenn sich etwas unter src-tauri/ ändert (Merge auf main) oder von Hand – Windows-Minuten
# zählen bei privaten Repos doppelt. Reine Web-Änderungen kommen per Live-Update ohne neue .exe.
# Voraussetzung (docs/WINDOWS.md): Secrets TAURI_SIGNING_PRIVATE_KEY und TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# Variable TAURI_SIGNING_PUBLIC_KEY – erzeugt mit „Windows-Schlüssel erzeugen“. Optional (Selbst-Update):
# Cloudflare-Secrets wie bei „Android Release“.
# Die Version steht in src-tauri/tauri.conf.json; sie muss bei jeder Änderung steigen (Workflow „Prüfen“).
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
  workflow_dispatch:

permissions:
  contents: write # GitHub Release anlegen

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APK_PROJEKT: wep-pankow-apk # muss zu BASIS_URL in tools/apk-site.mjs und zur Adresse in src-tauri/tauri.conf.json passen
    steps:
      - name: Schlüssel prüfen
        run: |
          fehlend=""
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_SIGNING_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then fehlend="$fehlend $name"; fi
          done
          if [ -n "$fehlend" ]; then
            echo "::error title=Windows-Schlüssel fehlt::Es fehlen:$fehlend. Zuerst den Workflow „Windows-Schlüssel erzeugen“ ausführen und Secrets/Variable anlegen (docs/WINDOWS.md, Abschnitt „Update-Schlüssel einrichten“)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für die Änderungsliste

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust bereitstellen
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Hinweis zur Client-ID
        if: ${{ env.VITE_MS_CLIENT_ID == '' }}
        run: echo "::warning::Repository-Variable VITE_MS_CLIENT_ID fehlt – das Programm hat keinen Login (siehe docs/WINDOWS.md)."

      - name: Version bestimmen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="windows-v$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error title=Version schon veröffentlicht::Das Release $tag gibt es schon. Bitte version in src-tauri/tauri.conf.json und src-tauri/Cargo.toml erhöhen."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - name: Update-Paket aus dem Web-Teil entfernen
        run: rm -rf dist/updates

      - name: Rust-Tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Signierten Installer bauen
        run: |
          # Schlüssel für Programm-Updates und Update-Artefakte nur für diesen Build zuschalten
          node -e '
            const fs = require("fs")
            fs.writeFileSync(process.env.RUNNER_TEMP + "/tauri-release.json", JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey: process.env.TAURI_SIGNING_PUBLIC_KEY } },
            }))'
          npx tauri build --bundles nsis --config "$RUNNER_TEMP/tauri-release.json"

      - name: Installer prüfen und benennen
        run: |
          ordner=src-tauri/target/release/bundle/nsis
          setup=$(ls "$ordner"/*-setup.exe | head -1)
          [ -f "$setup.sig" ] || { echo "::error::Signatur $setup.sig fehlt – wurde createUpdaterArtifacts übernommen?"; exit 1; }
          cp "$setup" "WEP-Windows-${{ steps.version.outputs.name }}-setup.exe"
          cp "$setup.sig" "WEP-Windows-setup.exe.sig"
          ls -la WEP-Windows-*

      - name: Änderungsliste
        run: |
          vorher=$(git tag --list 'windows-v*' --sort=-creatordate | head -1)
          if [ -n "$vorher" ]; then bereich="$vorher..HEAD"; else bereich="-n 15"; fi
          {
            echo "Änderungen seit der letzten Version:"
            echo
            git log $bereich --no-merges --pretty='- %s' -- src-tauri | head -30
          } > aenderungen.md
          cat aenderungen.md

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "WEP-Windows-${{ steps.version.outputs.name }}-setup.exe" \
            --target "${{ github.sha }}" \
            --title "WEP Windows ${{ steps.version.outputs.name }}" \
            --notes-file aenderungen.md \
            --latest=false

      - name: Hinweis zu den Cloudflare-Secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning title=Installer nicht auf Cloudflare::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen – das Programm kann sich nicht selbst aktualisieren (docs/WINDOWS.md). Das GitHub Release ist trotzdem angelegt."

      - name: Installer auf Cloudflare Pages bereitstellen
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true # das Release ist schon veröffentlicht; ein Fehler hier soll es nicht rückgängig machen
        run: |
          set -euo pipefail
          mkdir apk-site
          # Die Android-Dateien (wep.apk, apk.json) der Live-Seite mitnehmen, sonst löscht der Deploy sie
          node tools/apk-site.mjs uebernehmen android apk-site
          node tools/apk-site.mjs windows-bereitstellen apk-site \
            "WEP-Windows-${{ steps.version.outputs.name }}-setup.exe" WEP-Windows-setup.exe.sig \
            "${{ steps.version.outputs.name }}" aenderungen.md
          cat apk-site/windows/latest.json
          # Projekt beim ersten Mal anlegen (schlägt fehl, wenn es schon existiert – dann egal)
          npx --yes wrangler@4 pages project create "$APK_PROJEKT" --production-branch main || true
          npx --yes wrangler@4 pages deploy apk-site --project-name "$APK_PROJEKT" --branch main --commit-dirty=true

      - name: Hinweis bei Fehler auf Cloudflare
        if: ${{ steps.cloudflare.outcome == 'failure' }}
        run: |
          echo "::warning title=Upload auf Cloudflare fehlgeschlagen::Das GitHub Release ist angelegt, aber die Selbst-Update-Adresse wurde nicht aktualisiert. Token-Rechte (Cloudflare Pages: Edit), Kontonummer und die Meldung oben prüfen (docs/WINDOWS.md)."
