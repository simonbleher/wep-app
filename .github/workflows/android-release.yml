name: Android Release

# Baut die signierte Release-APK und veröffentlicht sie als GitHub Release.
# Voraussetzung: vier Secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORT,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORT) – erzeugt mit „Android-Schlüssel erzeugen“,
# siehe docs/ANDROID.md. Ohne sie bricht der Lauf mit einer Meldung ab.
# Versionsname: package.json, versionCode: Lauf-Nummer.
# Zusätzlich (optional): die signierte APK geht auf ein eigenes Cloudflare-Pages-Projekt
# (feste URL /wep.apk + apk.json), damit die App sich selbst aktualisieren kann – ohne
# GitHub-Anmeldung. Dafür die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID
# (docs/ANDROID.md); ohne sie gibt es nur eine Warnung, das Release bleibt.
on:
  push:
    branches: [main] # jeder Commit auf main bekommt eine APK (Update-Hinweis vergleicht Commits)
  workflow_dispatch:

permissions:
  contents: write # GitHub Release anlegen

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORT: ${{ secrets.ANDROID_KEY_PASSWORT }}
      WEP_VERSION_CODE: ${{ github.run_number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APK_PROJEKT: wep-pankow-apk # muss zu APK_BASIS_URL in src/android/update.ts passen
    steps:
      - name: Secrets prüfen
        run: |
          fehlend=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORT ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORT; do
            if [ -z "${!name}" ]; then fehlend="$fehlend $name"; fi
          done
          if [ -n "$fehlend" ]; then
            echo "::error title=Release-Schlüssel fehlt::Es fehlen die Secrets:$fehlend. Zuerst den Workflow „Android-Schlüssel erzeugen“ ausführen und die Secrets anlegen (docs/ANDROID.md, Abschnitt „Release-Schlüssel einrichten“)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für die Änderungsliste

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-Lizenzen annehmen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Hinweis zur Client-ID
        if: ${{ env.VITE_MS_CLIENT_ID == '' }}
        run: echo "::warning::Repository-Variable VITE_MS_CLIENT_ID fehlt – die APK hat keinen Login (siehe docs/ANDROID.md)."

      - name: Version bestimmen
        id: version
        run: |
          name=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$WEP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$name-$WEP_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build # schreibt dist/version.json mit WEP_VERSION_CODE
      - run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      - name: Schlüssel bereitstellen
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/wep-release.jks"
          # Leerzeichen, Zeilenumbrüche und Windows-Zeilenenden (\r) aus dem kopierten Secret entfernen
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$ks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist kein gültiges Base64. Bitte das Secret neu anlegen und NUR die lange Zeile aus zugangsdaten.txt kopieren (ohne Überschrift)."
            exit 1
          fi
          groesse=$(stat -c %s "$ks")
          if [ "$groesse" -lt 1000 ]; then
            echo "::error::Schlüsseldatei ist nur $groesse Bytes groß – ANDROID_KEYSTORE_BASE64 ist vermutlich nicht vollständig kopiert."
            exit 1
          fi
          # Passwort und Alias früh prüfen, damit der Fehler verständlich ist
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORT -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Schlüsseldatei ok, aber ANDROID_KEYSTORE_PASSWORT oder ANDROID_KEY_ALIAS passt nicht (Werte aus zugangsdaten.txt prüfen, ohne Leerzeichen)."
            exit 1
          fi
          echo "Schlüssel bereitgestellt ($groesse Bytes)."
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        working-directory: android
        run: >
          ./gradlew assembleRelease --console=plain
          -PwepVersionName=${{ steps.version.outputs.name }}
          -PwepVersionCode=${{ steps.version.outputs.code }}

      - name: APK prüfen und benennen
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "::error::APK ist nicht signiert."; exit 1;; esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          cp "$apk" "WEP-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"

      - name: Änderungsliste
        run: |
          vorher=$(git tag --list 'android-v*' --sort=-creatordate | head -1)
          if [ -n "$vorher" ]; then bereich="$vorher..HEAD"; else bereich="-n 15"; fi
          {
            echo "Änderungen seit der letzten Version:"
            echo
            git log $bereich --no-merges --pretty='- %s' | head -30
          } > aenderungen.md
          cat aenderungen.md

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "WEP-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk" \
            --target "${{ github.sha }}" \
            --title "WEP ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes-file aenderungen.md \
            --latest

      - name: Hinweis zu den Cloudflare-Secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning title=APK nicht auf Cloudflare::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen – die App kann sich nicht selbst aktualisieren (docs/ANDROID.md, Abschnitt „Selbst-Update“). Das GitHub Release ist trotzdem angelegt."

      - name: APK auf Cloudflare Pages bereitstellen
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true # das Release ist schon veröffentlicht; ein Fehler hier soll es nicht rückgängig machen
        run: |
          set -euo pipefail
          apk="WEP-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          mkdir apk-site
          cp "$apk" apk-site/wep.apk
          sha=$(sha256sum apk-site/wep.apk | cut -d' ' -f1)
          APK_SHA="$sha" APK_NAME="${{ steps.version.outputs.name }}" APK_CODE="${{ steps.version.outputs.code }}" \
          APK_COMMIT="${{ github.sha }}" APK_PROJEKT_NAME="$APK_PROJEKT" node -e '
            const fs = require("fs")
            fs.writeFileSync("apk-site/apk.json", JSON.stringify({
              versionName: process.env.APK_NAME,
              versionCode: Number(process.env.APK_CODE),
              nativeVersion: Number(fs.readFileSync("android/native-version.txt", "utf8").trim()),
              commit: process.env.APK_COMMIT,
              sha256: process.env.APK_SHA,
              apkUrl: `https://${process.env.APK_PROJEKT_NAME}.pages.dev/wep.apk`,
              gebautAm: new Date().toISOString(),
            }, null, 2) + "\n")'
          cat > apk-site/_headers <<'EOF'
          /apk.json
            Cache-Control: no-cache
            Access-Control-Allow-Origin: *
          /wep.apk
            Cache-Control: no-cache
            Content-Type: application/vnd.android.package-archive
          EOF
          cat apk-site/apk.json
          # Die Windows-Dateien (/windows/…) der Live-Seite mitnehmen, sonst löscht der Deploy sie
          # (Windows-Programm, docs/WINDOWS.md). Fehlen sie noch, ist das in Ordnung; bei einem Fehler
          # bricht der Schritt ab, damit nichts versehentlich gelöscht wird.
          node tools/apk-site.mjs uebernehmen windows apk-site
          # Projekt beim ersten Mal anlegen (schlägt fehl, wenn es schon existiert – dann egal)
          npx --yes wrangler@4 pages project create "$APK_PROJEKT" --production-branch main || true
          npx --yes wrangler@4 pages deploy apk-site --project-name "$APK_PROJEKT" --branch main --commit-dirty=true

      - name: Hinweis bei Fehler auf Cloudflare
        if: ${{ steps.cloudflare.outcome == 'failure' }}
        run: |
          echo "::warning title=APK-Upload auf Cloudflare fehlgeschlagen::Das GitHub Release ist angelegt, aber die Selbst-Update-Adresse wurde nicht aktualisiert. Token-Rechte (Cloudflare Pages: Edit) und Kontonummer prüfen (docs/ANDROID.md)."
