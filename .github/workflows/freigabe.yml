name: Version freigeben

# Gibt einen Stand von main für alle Geräte frei (docs/FREIGABE.md):
# - setzt den Branch `release` auf den gewählten Commit (Standard: aktueller main),
# - Cloudflare Pages baut `release` als Produktion (wep-pankow.pages.dev) → Web-App und Live-Updates,
# - startet „Android Release“ und – nur wenn sich src-tauri/ geändert hat – „Windows Release“.
# Ein Push mit dem GITHUB_TOKEN löst keine anderen Workflows aus, deshalb werden sie hier ausdrücklich gestartet.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit oder Branch, der freigegeben wird (leer = aktueller main)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: freigabe
  cancel-in-progress: false

jobs:
  freigeben:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stand bestimmen
        id: stand
        run: |
          set -euo pipefail
          ziel="${{ inputs.commit }}"
          [ -n "$ziel" ] || ziel="origin/main"
          neu=$(git rev-parse --verify "$ziel^{commit}")
          git merge-base --is-ancestor "$neu" origin/main || { echo "::error::$ziel liegt nicht auf main – nur Stände von main können freigegeben werden."; exit 1; }
          alt=$(git rev-parse --verify origin/release^{commit} 2>/dev/null || echo "")
          if [ "$alt" = "$neu" ]; then echo "::notice::Dieser Stand ist schon freigegeben."; fi
          windows=false
          if [ -z "$alt" ] || git diff --name-only "$alt" "$neu" -- src-tauri | grep -q .; then windows=true; fi
          echo "neu=$neu" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          {
            echo "### Freigabe"
            echo "- Stand: \`${neu:0:7}\` – $(git log -1 --format=%s "$neu")"
            echo "- Vorher freigegeben: \`${alt:0:7}\`"
            echo "- Windows-Programm neu bauen: $windows"
            [ -n "$alt" ] && { echo ""; echo "Änderungen seit der letzten Freigabe:"; git log --format='- %s' "$alt..$neu" | head -40; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Branch release setzen
        run: git push --force origin "${{ steps.stand.outputs.neu }}:refs/heads/release"

      - name: Web-App bei Cloudflare bauen (Deploy Hook)
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          # Ein Push mit dem GITHUB_TOKEN löst bei Cloudflare nicht zuverlässig einen Produktions-Build aus;
          # der Deploy Hook (Branch release) startet ihn ausdrücklich (docs/FREIGABE.md).
          if [ -z "$HOOK" ]; then
            echo "::warning title=Web-App nicht neu gebaut::Secret CLOUDFLARE_DEPLOY_HOOK fehlt – die Web-App und die Live-Updates bleiben auf dem alten Stand (docs/FREIGABE.md)."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Cloudflare-Build für release angestoßen."
          fi

      - name: Android Release starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-release.yml --ref release

      - name: Windows Release starten
        if: steps.stand.outputs.windows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-release.yml --ref release
